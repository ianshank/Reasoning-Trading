version: '3.8'

services:
  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: reasoning-trading-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-reasoningtrading}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - reasoning-trading-network

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: reasoning-trading-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # API Server
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=${API_WORKERS:-4}
      - API_RELOAD=false

      # JWT Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # CORS
      - CORS_ENABLED=${CORS_ENABLED:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      - RATE_LIMIT_BURST_SIZE=${RATE_LIMIT_BURST_SIZE:-10}

      # WebSocket
      - WS_HEARTBEAT_INTERVAL_SECONDS=${WS_HEARTBEAT_INTERVAL_SECONDS:-30}
      - WS_MAX_MESSAGE_SIZE_BYTES=${WS_MAX_MESSAGE_SIZE_BYTES:-1048576}
      - WS_CONNECTION_TIMEOUT_SECONDS=${WS_CONNECTION_TIMEOUT_SECONDS:-300}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-reasoningtrading}
      - REDIS_DB=${REDIS_DB:-0}

      # Database
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/enterprise_ui.db}
      - DATABASE_ECHO=${DATABASE_ECHO:-false}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-5}

      # Alpaca Trading (Core)
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_PAPER_TRADING=${ALPACA_PAPER_TRADING:-true}

      # OpenAI (Core)
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Anthropic (Core)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # LangSmith (Optional)
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-reasoning-trading}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      # Mount data directory for database
      - backend_data:/app/data
      # Mount reasoning_trading package (development mode)
      - ../src/reasoning_trading:/app/reasoning_trading:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - reasoning-trading-network

  # Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        NODE_VERSION: ${NODE_VERSION:-18}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:80/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:80/api/v1/ws}
    container_name: reasoning-trading-frontend
    restart: unless-stopped
    # Frontend is served by Nginx, no direct port exposure needed
    networks:
      - reasoning-trading-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: reasoning-trading-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      # Uncomment for SSL certificates
      # - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - reasoning-trading-network

volumes:
  redis_data:
    driver: local
  backend_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  reasoning-trading-network:
    driver: bridge
