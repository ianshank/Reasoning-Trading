[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-trading"
version = "0.1.0"
description = "MCTS-Enhanced Multi-Agent Trading Framework integrating AlpacaTradingAgent with LangGraph MCTS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Reasoning Trading Team"}
]
keywords = ["trading", "mcts", "langgraph", "multi-agent", "alpaca", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-experimental>=0.3.0",
    "langgraph>=0.2.0",

    # Trading
    "alpaca-py>=0.30.0",

    # Data & ML
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",

    # API & Async
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",

    # Redis for caching
    "redis>=5.0.0",

    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Financial data
    "finnhub-python>=2.4.0",
    "yfinance>=0.2.40",

    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.100.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.6.0",
]

analysis = [
    "stockstats>=0.6.0",
    "ta>=0.11.0",
    "chromadb>=0.4.0",
]

webui = [
    "dash>=3.0.0",
    "dash-bootstrap-components>=2.0.0",
    "plotly>=5.18.0",
    "gradio>=4.0.0,<5.0.0",
]

[project.scripts]
reasoning-trading = "reasoning_trading.cli:main"
trading-api = "reasoning_trading.api.server:main"

[project.urls]
Homepage = "https://github.com/ianshank/Reasoning-Trading"
Documentation = "https://github.com/ianshank/Reasoning-Trading#readme"
Repository = "https://github.com/ianshank/Reasoning-Trading"
Issues = "https://github.com/ianshank/Reasoning-Trading/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=reasoning_trading --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B006",  # mutable default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["reasoning_trading"]

[tool.coverage.run]
source = ["src/reasoning_trading"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
