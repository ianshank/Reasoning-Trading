# =============================================================================
# Docker Compose for Reasoning Trading
# =============================================================================
# Services:
#   - api:         Main trading API server
#   - redis:       Cache and message broker
#   - redis-commander: Redis management UI (development only)
#
# Usage:
#   Development:  docker-compose up -d
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Testing:      docker-compose run --rm api pytest tests/
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: reasoning-trading:latest
    container_name: reasoning-trading-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application settings
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DEBUG=false

      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - CACHE_TTL=3600

      # MCTS settings (can be overridden in .env)
      - MCTS_SIMULATIONS=${MCTS_SIMULATIONS:-100}
      - MCTS_EXPLORATION_CONSTANT=${MCTS_EXPLORATION_CONSTANT:-1.414}
      - MCTS_MAX_DEPTH=${MCTS_MAX_DEPTH:-10}
      - MCTS_TIMEOUT=${MCTS_TIMEOUT:-30}

      # Risk management
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-0.1}
      - STOP_LOSS_PCT=${STOP_LOSS_PCT:-0.02}
      - TAKE_PROFIT_PCT=${TAKE_PROFIT_PCT:-0.05}

    env_file:
      - .env
    volumes:
      # Mount source for development hot-reload
      - ./src:/app/src:ro
      # Persistent data storage
      - trading-data:/app/data
      - trading-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis - Cache and Message Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reasoning-trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis Commander - Web UI for Redis (Development Only)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: reasoning-trading-redis-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - trading-network
    profiles:
      - dev  # Only starts with: docker-compose --profile dev up

  # ---------------------------------------------------------------------------
  # Development Service - For Running Tests
  # ---------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: reasoning-trading-test
    environment:
      - TESTING=true
      - REDIS_URL=redis://redis:6379/1
      - LOG_LEVEL=WARNING
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-network
    profiles:
      - test  # Only starts with: docker-compose --profile test up
    command: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # CLI Service - For Running CLI Commands
  # ---------------------------------------------------------------------------
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: reasoning-trading-cli
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - trading-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trading-network
    profiles:
      - cli  # Only starts with: docker-compose --profile cli run cli <command>
    entrypoint: ["reasoning-trading"]
    command: ["--help"]

# =============================================================================
# Networks
# =============================================================================
networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  trading-data:
    driver: local
  trading-logs:
    driver: local
